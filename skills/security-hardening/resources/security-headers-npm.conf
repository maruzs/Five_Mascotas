# ==============================================================================
# Cabeceras y Parámetros de Seguridad HTTP para Nginx / Nginx Proxy Manager (NPM)
# Ubicación en NPM: Proxy Host -> Advanced -> Custom Nginx Configuration
# ==============================================================================

# 1. Prevenir que la web sea embebida en un iframe ajeno (Anti-Clickjacking)
add_header X-Frame-Options "DENY" always;

# 2. Prevenir que el navegador interprete archivos como un MIME distinto al declarado (Anti-MIME-sniffing)
add_header X-Content-Type-Options "nosniff" always;

# 3. Controlar la información de referencia enviada en peticiones salientes
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 4. Forzar conexiones HTTPS continuas durante 2 años (HSTS con inclusión de subdominios y preload)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# 5. Restringir acceso no autorizado a APIs de hardware del dispositivo del cliente
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# 6. Aislamiento de Origen Cruzado (Cross-Origin Isolation)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Descomentar si no se consumen recursos de terceros sin CORP compatible:
# add_header Cross-Origin-Embedder-Policy "require-corp" always;

# 7. Content Security Policy (Ajustar dominios según los servicios utilizados)
# Permite recursos propios y scripts de validación anti-bot (Cloudflare Turnstile)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# 8. Ocultar la versión exacta del servidor web en encabezados HTTP
server_tokens off;

# ==============================================================================
# Parámetros de Mitigación de Denegación de Servicio (DoS / Slowloris / Memory Exhaustion)
# ==============================================================================

# Limitar el tamaño máximo permitido del cuerpo de la petición (previene desbordamiento de memoria)
client_max_body_size 10M;

# Tiempos de espera estrictos para mitigar ataques de peticiones lentas (Slowloris)
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 30s;
send_timeout 10s;

